<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="currenct.css">
    <title>project</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <div class="cantainer">
    <h2>Currency convert</h2>
    <form>
        <div class="amount"></div>
        <p>Enter the Amount</p>
        <input value="100" type="text">
    </form>
    <div class="dropdown">
        <div class="from">
            <p>FROM</p>
            <div class="select_cantainer">
                <img src="https://flagsapi.com/US/flat/64.png">
                <select name="from">
                    <option class="USD">USD</option>
                    <option class="IND">IND</option>
                    <option class="AUD">AUD</option>
                    <option class="EUR">EUR</option>
                </select>
            </div>
            <div class="to">TO
                <div class="select_cantainer">
                <img src="https://flagsapi.com/IN/flat/64.png">
                <select name="from">
                    <option class="USD">USD</option>
                    <option class="IND">IND</option>
                    <option class="AUD">AUD</option>
                    <option class="EUR">EUR</option>
                </select>
            </div>
        </div>
            <div class="msg">
                1USd=95INR
            </div>
            <button>Get Exchange</button>
            </div>
        </div>
    </div>
    <script src="currency.js"></script>
    <script src="codes.js"></script>
</body>
</html>
